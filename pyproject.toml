[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nexo"
version = "0.1.0"
description = "Procesamiento de eventos con FastAPI, PostgreSQL y RabbitMQ"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "SQLAlchemy[asyncio]>=2.0.38,<2.1", "asyncpg>=0.30,<1",
  "alembic>=1.14,<2", "aio-pika>=9.5,<10", "redis>=5.2,<7",
  "pydantic-settings>=2.7,<3", "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1", "python-multipart>=0.0.20,<1",
  "prometheus-client>=0.21,<1", "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "aiosqlite>=0.21,<1", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["nexo*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["pruebas"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]
