name: Pruebas
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexo
          POSTGRES_PASSWORD: test-db-password
          POSTGRES_DB: nexo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexo -d nexo_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      JWT_SECRET: test-signing-secret-with-at-least-32-characters
      DATABASE_URL: postgresql+asyncpg://nexo:test-db-password@localhost:5432/nexo_test
      NEXO_TEST_DATABASE_URL: postgresql+asyncpg://nexo:test-db-password@localhost:5432/nexo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q

  servicios:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.lock
      - name: Preparar servicios
        run: |
          cp .env.example .env
          python -c "import secrets; from pathlib import Path; p=Path('.env'); p.write_text(p.read_text().replace('replace-this-with-a-random-secret-at-least-32-characters', secrets.token_urlsafe(48)))"
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: python herramientas/prueba_rapida.py
      - name: Detener RabbitMQ y el trabajador
        run: docker compose stop trabajador rabbitmq
      - run: python herramientas/prueba_rapida.py --fase guardar
      - run: docker compose start rabbitmq trabajador
      - run: python herramientas/prueba_rapida.py --fase comprobar
      - name: Guardar diagnostico si falla
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 100
      - name: Limpiar datos de prueba
        if: always()
        run: docker compose down -v
